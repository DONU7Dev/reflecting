name: Build installers
on: { workflow_dispatch: {} }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: "" }
          - { os: macos-latest, args: "--target aarch64-apple-darwin" }
          - { os: macos-latest, args: "--target x86_64-apple-darwin" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - run: npm install
      - run: npx tauri icon app-icon.png
      - run: npx tauri build ${{ matrix.args }}
        env:
          APPLE_SIGNING_IDENTITY: "-"
      - uses: actions/upload-artifact@v4
        with:
          name: reflecting-${{ matrix.os }}-${{ strategy.job-index }}
          path: |
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.msi
            src-tauri/target/**/bundle/nsis/*.exe
